[project]
name = "git-sentry"
version = "0.1.0"
description = "Autonomous Blast-Radius Analyzer & Secret Quarantine for Git"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "google-genai>=0.3.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
git-sentry = "cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent", "cli", "config", "context", "scanner", "snapshot"]